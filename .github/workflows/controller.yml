name: Study controller
run-name: lrcs-${{ inputs.attempt_id }}
on:
  workflow_dispatch:
    inputs:
      identity_only:
        type: boolean
        default: true
      attempt_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: lrcs-study-serial
  cancel-in-progress: false
jobs:
  observe:
    if: inputs.identity_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          architecture: x64
          freethreaded: false
      - name: Observe pinned tools and kernel without cloud credentials
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python - <<'PY'
          import json,os,platform,subprocess,sys
          from pathlib import Path
          from scripts.lrcs.install_tools import install
          assert not any(os.environ.get(k) for k in ('AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN'))
          installed=install(Path(os.environ['RUNNER_TEMP'])/'lrcs-tools-observation')
          actual={}
          for program in ('aws','gh'):
              p=subprocess.run([program,'--version'],capture_output=True,text=True,check=True,timeout=20)
              actual[program]=(p.stdout+p.stderr).strip()
          actual.update(python=sys.version,runner_image=os.environ['ImageVersion'],runner_os=os.environ['RUNNER_OS'])
          print('LRCS_RUNNER_METADATA='+json.dumps(dict(tool_versions=actual,kernel=platform.release(),installation=installed),sort_keys=True))
          PY
